<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Eventos - Admin</title>
    <style>table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding:6px; }</style>
</head>
<body>
<h1>Eventos</h1>
<a th:href="@{/admin/events/new}">Crear evento</a>

<div th:if="${events.size()} &gt; 0">
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${events}">
            <td th:text="${e.id}">1</td>
            <td th:text="${e.name}">Nombre</td>
            <td th:text="${e.date}">2026-01-01</td>
            <td>
                <a th:href="@{|/admin/events/${e.id}/edit|}">Editar</a>
                |
                <a th:href="@{|/admin/events/${e.id}/delete|}">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<p th:if="${events.size()} == 0">Actualmente no hay eventos programados</p>

</body>
</html>
