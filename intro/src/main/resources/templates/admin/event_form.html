<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Evento Form</title>
</head>
<body>
<h1 th:if="${event.id} == null">Crear Evento</h1>
<h1 th:unless="${event.id} == null">Editar Evento</h1>

<form th:action="@{/admin/events}" th:object="${event}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div>
        <label>Nombre: <input type="text" th:field="*{name}" /></label>
    </div>
    <div>
        <label>Fecha: <input type="date" th:field="*{date}" /></label>
    </div>
    <div>
        <label>Descripción: <textarea th:field="*{description}"></textarea></label>
    </div>
    <div>
        <button type="submit">Guardar</button>
    </div>
</form>

<a th:href="@{/admin/events}">Volver</a>

</body>
</html>
